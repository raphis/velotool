<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c64c7"/>
      <stop offset="100%" stop-color="#0d3a75"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>

  <!-- bicycle -->
  <g fill="none" stroke="#eef6f4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(-16 -6) scale(0.88)">
    <!-- wheels -->
    <circle cx="60" cy="132" r="30"/>
    <circle cx="140" cy="132" r="30"/>
    <circle cx="60" cy="132" r="3.5" fill="#eef6f4" stroke="none"/>
    <circle cx="140" cy="132" r="3.5" fill="#eef6f4" stroke="none"/>

    <!-- frame -->
    <path d="M60 132 L96 132 L82 84 L60 132 Z"/>
    <path d="M96 132 L126 100 L134 132"/>
    <path d="M82 84 L118 84"/>

    <!-- seat post + saddle -->
    <path d="M82 84 L86 70"/>
    <path d="M74 68 L98 68"/>

    <!-- fork -->
    <path d="M118 84 L140 132"/>

    <!-- handlebar -->
    <path d="M118 84 L108 76"/>
    <path d="M100 72 L116 78"/>

    <!-- crank + pedal -->
    <circle cx="96" cy="132" r="6"/>
  </g>

  <!-- wrench badge accent -->
  <circle cx="152" cy="150" r="30" fill="#f2994a"/>
  <g transform="translate(152 150) rotate(28) scale(0.34)">
    <defs>
      <mask id="wrenchMask">
        <rect x="-60" y="-60" width="160" height="160" fill="black"/>
        <g fill="white">
          <rect x="6" y="0" width="26" height="70" rx="7"/>
          <path d="M-14 -34
                   a33 33 0 0 1 66 0
                   a33 33 0 0 1 -16 28.4
                   l0 20.6
                   h-34
                   l0 -20.6
                   a33 33 0 0 1 -16 -28.4
                   z"/>
        </g>
        <g fill="black">
          <circle cx="19" cy="-34" r="13"/>
          <circle cx="-6" cy="-18" r="8"/>
          <circle cx="44" cy="-18" r="8"/>
        </g>
      </mask>
    </defs>
    <rect x="-60" y="-60" width="160" height="160" fill="#0d3a75" mask="url(#wrenchMask)"/>
  </g>
</svg>
